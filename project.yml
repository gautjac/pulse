name: Pulse
options:
  bundleIdPrefix: com.jacquesgautreau
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9WZ66DZ69J"
packages:
  PulseKit:
    path: PulseKit
targets:
  Pulse:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Pulse
        excludes: ["Info.plist"]
    dependencies:
      - package: PulseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacquesgautreau.pulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Pulse/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    info:
      path: Pulse/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [com.jacquesgautreau.pulse.start]
  PulseTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PulseTests
    dependencies:
      - target: Pulse
      - package: PulseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacquesgautreau.pulse.tests
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Pulse.app/Contents/MacOS/Pulse"
        "TEST_HOST[sdk=iphone*]": "$(BUILT_PRODUCTS_DIR)/Pulse.app/Pulse"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
    test:
      targets: [PulseTests]
